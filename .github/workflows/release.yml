name: Release to npm

# Publishes the package when a GitHub release is published, using npm trusted
# publishing (OIDC): no npm token is stored anywhere. The trusted publisher on
# npmjs.com must name this file, release.yml, and the "npm" environment below.

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write # lets npm exchange the GitHub OIDC token for a short-lived publish token

concurrency:
  group: npm-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false # never cache in release builds

      - name: Ensure npm supports trusted publishing (11.5.1+)
        run: |
          if ! node -e 'const [a, b, c] = process.argv[1].split(".").map(Number); process.exit(a > 11 || (a === 11 && (b > 5 || (b === 5 && c >= 1))) ? 0 : 1)' "$(npm --version)"; then
            npm install -g npm@^11.5.1
          fi
          npm --version

      - name: Release tag matches package.json
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "v$VERSION" ]; then
            echo "::error::Release tag $TAG does not match package.json version $VERSION (expected v$VERSION)."
            exit 1
          fi

      - name: Check icons
        run: node tools/check.js

      - name: SVG files are up to date
        run: |
          node tools/build-svg.js
          if ! git diff --quiet -- svg/; then
            echo "::error::svg/ is out of date. Run npm run build and commit the result."
            git diff --stat -- svg/
            exit 1
          fi

      - name: Publish
        env:
          PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          if [ "$PRERELEASE" = "true" ]; then
            npm publish --tag next
          else
            npm publish
          fi
